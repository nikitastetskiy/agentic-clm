services:
  auto-pptx:
    build:
      context: .
      args:
        INSTALL_OFFICE: "true"
    image: auto-pptx:latest
    env_file:
      - .env
    volumes:
      # The built decks, the fetched data and the build state stay on the host.
      - ./output:/work/output
      - ./data:/work/data
      - ./state:/work/state
    # One-shot build; the container exits when the deck is verified.
    restart: "no"
