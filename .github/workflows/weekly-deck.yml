# The weekly deck on GitHub Actions: the same job as the IBM SPS pipeline (docs/pipelines.md).
# ci/run.sh does all the work; this file only provides a runner, the settings and the schedule.
#
# A build that fails in a way a code change could repair (ci_trigger_selfheal in ci/lib.sh) starts
# the self-heal job below, which runs .github/workflows/self-heal.yml.
name: Weekly deck

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC: 06:17 in Madrid in winter, 07:17 in summer
  workflow_dispatch:
    inputs:
      mode:
        description: "weekly: build and publish the deck. preflight: only report what the runner can reach, and check the gateway key."
        type: choice
        options: [weekly, preflight]
        default: weekly
      dry-run:
        description: "Rehearse: build for real, but publish, push and report nothing."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: auto-pptx-deck
  cancel-in-progress: false

env:
  TZ: Europe/Madrid

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Where KEY_ENVIRONMENT names an environment holding ICA_API_KEY that only main may use, a run
    # from another branch is not given the key: it runs without it, with the rule-based wording.
    environment: ${{ github.ref == 'refs/heads/main' && vars.KEY_ENVIRONMENT || '' }}
    permissions:
      contents: write   # the release and the state/ commit
    outputs:
      self-heal: ${{ steps.run.outputs.self-heal }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # pushes go through ci/askpass.sh; no token is left in .git/config

      - uses: ./.github/actions/setup

      - name: Build, verify and publish
        id: run
        env:
          PIPELINE_MODE: ${{ inputs.mode || 'weekly' }}
          CI_DRY_RUN: ${{ inputs.dry-run && '1' || '0' }}
          PIPELINE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          ICA_API_KEY: ${{ secrets.ICA_API_KEY }}
          ICA_BASE_URL: ${{ vars.ICA_BASE_URL }}
          ENRICH: ${{ vars.ENRICH }}
          ENRICH_MODEL: ${{ vars.ENRICH_MODEL }}
          ENRICH_FALLBACK_MODEL: ${{ vars.ENRICH_FALLBACK_MODEL }}
          REVIEW_MODELS: ${{ vars.REVIEW_MODELS }}   # only checked by the preflight here
          EVENT_SCOPE: ${{ vars.EVENT_SCOPE }}
          STRICT: ${{ vars.STRICT }}
          RELEASE_KEEP: ${{ vars.RELEASE_KEEP }}
          BASE_BRANCH: ${{ vars.BASE_BRANCH || github.ref_name }}
          STATE_BRANCH: ${{ vars.STATE_BRANCH || 'pipeline-state' }}
        run: |
          # Without the gateway key there is no model to call: the deck keeps its rule-based wording.
          if [[ -z "$ICA_API_KEY" ]]; then export ENRICH="${ENRICH:-0}"; fi
          bash ci/run.sh

      - name: Remove secret values from the files kept with this run
        if: always()
        env:
          ICA_API_KEY: ${{ secrets.ICA_API_KEY }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/scrub_secrets.py output data

      - name: Keep the deck, the summary and the logs with this run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: weekly-output
          path: |
            output/
            data/build-report.json
            data/verify-report.json
          retention-days: 30
          if-no-files-found: ignore

  self-heal:
    needs: build
    if: failure() && needs.build.outputs.self-heal == 'true'
    permissions:
      contents: write        # the repair branch and the deck built from it
      pull-requests: write   # the pull request with the repair
      issues: write          # the issue when nothing could be repaired
    uses: ./.github/workflows/self-heal.yml
    secrets: inherit
