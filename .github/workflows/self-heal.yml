# The self-heal run on GitHub Actions: the same job as the SPS self-heal pipeline (docs/pipelines.md).
# It starts as a job of a failed weekly run (.github/workflows/weekly-deck.yml), or by hand.
#
# ci/self-heal.sh reproduces the failure; if it persists, the repo-fixer agent repairs the code on a
# large model, scripts/check_fix.py judges the change, the tests and a full rebuild prove it, and the
# repair is proposed as a pull request (never merged automatically) — or reported as an issue. The
# review job then reviews that pull request (scripts/review_pr.py) from a fresh checkout: the repair
# job ran code the agent wrote, so the reviewer and its keys are kept out of it.
name: Self-heal

on:
  workflow_call:
    inputs:
      dry-run:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Rehearse: run everything, including the repair agent, but push and report nothing."
        type: boolean
        default: false

permissions:
  contents: read

env:
  TZ: Europe/Madrid

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 180   # three builds and up to two agent rounds of fix-timeout (45 min) each
    # Where KEY_ENVIRONMENT names an environment holding ICA_API_KEY that only main may use, a run
    # from another branch is not given the key: it runs without it, with the rule-based wording.
    environment: ${{ github.ref == 'refs/heads/main' && vars.KEY_ENVIRONMENT || '' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      pull-branch: ${{ steps.run.outputs.pull-branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The repair agent has a shell in this checkout: leave no token in .git/config.
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Reproduce, repair, prove, propose
        id: run
        env:
          PIPELINE_MODE: self-heal
          CI_DRY_RUN: ${{ inputs.dry-run && '1' || '0' }}
          PIPELINE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          ICA_API_KEY: ${{ secrets.ICA_API_KEY }}
          ICA_BASE_URL: ${{ vars.ICA_BASE_URL }}
          ENRICH: ${{ vars.ENRICH }}
          ENRICH_MODEL: ${{ vars.ENRICH_MODEL }}
          ENRICH_FALLBACK_MODEL: ${{ vars.ENRICH_FALLBACK_MODEL }}
          FIX_MODEL: ${{ vars.FIX_MODEL }}
          FIX_FALLBACK_MODEL: ${{ vars.FIX_FALLBACK_MODEL }}
          FIX_ATTEMPTS: ${{ vars.FIX_ATTEMPTS }}
          FIX_TIMEOUT: ${{ vars.FIX_TIMEOUT }}
          EVENT_SCOPE: ${{ vars.EVENT_SCOPE }}
          STRICT: ${{ vars.STRICT }}
          RELEASE_KEEP: ${{ vars.RELEASE_KEEP }}
          BASE_BRANCH: ${{ vars.BASE_BRANCH || github.ref_name }}
          STATE_BRANCH: ${{ vars.STATE_BRANCH || 'pipeline-state' }}
        run: |
          if [[ -z "$ICA_API_KEY" ]]; then
            echo "::warning::The ICA_API_KEY secret is not set: the repair agent cannot run, so a failure that persists becomes an issue."
            export ENRICH="${ENRICH:-0}"
          fi
          bash ci/run.sh

      - name: Remove secret values from the files kept with this run
        if: always()
        env:
          ICA_API_KEY: ${{ secrets.ICA_API_KEY }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/scrub_secrets.py output data

      - name: Keep the agent's logs, the verdict and the deck with this run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: self-heal-output
          path: |
            output/
            data/build-report.json
            data/verify-report.json
          retention-days: 30
          if-no-files-found: ignore

  review:
    # A pull request opened with the workflow's token starts no other workflow, so the pull request
    # review (.github/workflows/pr-review.yml) would never see the repair's.
    needs: repair
    if: ${{ always() && needs.repair.outputs.pull-branch != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ github.ref == 'refs/heads/main' && vars.KEY_ENVIRONMENT || '' }}
    permissions:
      contents: read
      pull-requests: write   # the comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # main's own code, not the repair's

      - name: Review the repair's pull request
        env:
          PULL_BRANCH: ${{ needs.repair.outputs.pull-branch }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ICA_API_KEY: ${{ secrets.ICA_API_KEY }}
          ICA_BASE_URL: ${{ vars.ICA_BASE_URL }}
          BOB_API_KEY: ${{ secrets.BOB_API_KEY }}
          REVIEW_MODELS: ${{ vars.REVIEW_MODELS }}
          REVIEW_MENTION: ${{ vars.REVIEW_MENTION }}
        run: python3 scripts/review_pr.py --head "$PULL_BRANCH"
