# What the Dockerfile puts in the SPS image, on a GitHub-hosted runner: Python and the requirements,
# Chromium for the pages that need a browser, the opencode CLI for the model steps, LibreOffice for
# the PDF preview, and the Inter font. Used by both workflows in .github/workflows/; the weekly build
# calls its wording model directly, so it skips opencode.
name: Set up the auto-pptx runner
description: Install the tools the weekly build and the self-heal run need.

inputs:
  opencode:
    description: "Install opencode, which only the self-heal repair agent needs. Node is always installed: Bob Shell, the last resort, needs it."
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Python packages
      shell: bash
      run: python -m pip install -r requirements.txt

    - name: Playwright version
      id: playwright
      shell: bash
      run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    - name: Chromium, LibreOffice and fonts
      shell: bash
      run: |
        python -m playwright install --with-deps chromium
        sudo apt-get install -y --no-install-recommends libreoffice-impress fonts-inter

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0   (opencode, and Bob Shell when needed)
      with:
        node-version: "22"

    - name: opencode
      if: inputs.opencode == 'true'
      shell: bash
      # The same version as the SPS image: the Dockerfile's OPENCODE_VERSION is the one place it is set.
      run: |
        version="$(sed -n 's/^ARG OPENCODE_VERSION=//p' Dockerfile)"
        npm install -g "opencode-ai@${version:?no OPENCODE_VERSION in the Dockerfile}"
        opencode --version
