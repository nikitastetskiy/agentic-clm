# Hero city photos for the featured-event slides (18-22).
#
# The featured-event hero image is the event city's photo (NOT the IBM/HashiCorp leadspace
# screenshot — that webpage capture duplicated the slide's own Title/date/description text, carried a
# stray divider line, and cropped badly). Keyed by the normalized event location (events.json
# "location"). Two source kinds:
#   bundled : a city photo that already ships in the SOURCE deck's media (extracted at edit time).
#             AVOID for cities whose deck slide is an event leadspace — media indices (image46.png …)
#             are deck-specific and a different deck can put an event-branded leadspace at that index
#             (e.g. this deck's image46 is the "Agentic Runtime Security Exchange - London" leadspace,
#             not a skyline). Prefer `file` for robustness across decks.
#   file    : a freely-licensed photo committed under assets/city-photos/ (see its CREDITS.md).
#
# Normalization: location is lower-cased, trimmed, and punctuation collapsed before lookup; `aliases`
# maps common variants onto a canonical key. Add a city here (prefer CC0/public-domain `file` photos)
# and every featured slot for that city picks it up automatically — no code change needed.

cities:
  london:        {source: file, file: assets/city-photos/london.jpg, note: "Tower Bridge (CC BY-SA 4.0)"}
  amsterdam:     {source: file, file: assets/city-photos/amsterdam.jpg, note: "Damrak canal houses (CC BY-SA 4.0)"}
  hanoi:         {source: file, file: assets/city-photos/hanoi.jpg, note: "skyline at dusk (CC0)"}
  washington dc: {source: file, file: assets/city-photos/washington-dc.jpg, note: "Potomac skyline (CC BY-SA 4.0)"}
  zurich:        {source: file, file: assets/city-photos/zurich.jpg, note: "Old Town + Limmat (CC BY-SA 3.0)"}
  paris:         {source: file, file: assets/city-photos/paris.jpg, note: "Eiffel Tower + cityscape (CC BY-SA 4.0)"}
  berlin:        {source: file, file: assets/city-photos/berlin.jpg, note: "Fernsehturm + Tiergarten (CC BY-SA 4.0)"}
  madrid:        {source: file, file: assets/city-photos/madrid.jpg, note: "Edificio Metropolis (CC BY-SA 4.0)"}
  munich:        {source: file, file: assets/city-photos/munich.jpg, note: "Frauenkirche + Old Town (CC BY-SA 3.0)"}
  dublin:        {source: file, file: assets/city-photos/dublin.jpg, note: "Convention Centre + Liffey (CC BY-SA 2.0)"}
  milan:         {source: file, file: assets/city-photos/milan.jpg, note: "Duomo di Milano (CC0)"}
  dubai:         {source: file, file: assets/city-photos/dubai.jpg, note: "Burj Khalifa skyline (CC BY 3.0)"}

aliases:
  "uk": london                  # CISO UK and similar UK events are held in London
  "united kingdom": london
  "england": london
  "washington, dc": washington dc
  "washington d.c.": washington dc
  "washington dc usa": washington dc
  "washington": washington dc
  "munchen": munich             # "Munchen"/"Munchen" (accent stripped by norm_city) -> munich
  "muenchen": munich
  "milano": milan
  "uae": dubai                  # MENA events in the UAE are held in Dubai
  "united arab emirates": dubai
  "ireland": dublin             # HashiCorp Ireland events are held in Dublin
